
services:
  postgres:
    image: postgres:16-alpine
    container_name: jih-postgres
    environment:
      POSTGRES_DB: jih_db
      POSTGRES_USER: jih_user
      POSTGRES_PASSWORD: jih_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
